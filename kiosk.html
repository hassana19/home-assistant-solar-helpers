<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Assistant Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        .dashboard {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: 0;
            opacity: 0;
            pointer-events: none;

            /* 1 second fade */
            transition: opacity 1s ease-in-out;
        }

        .dashboard.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ==========================================
           PROGRESS BAR
           ========================================== */

        .progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 7px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.15);
        }

        .progress-bar {
            width: 100%;
            height: 100%;
            background: rgba(90, 90, 90, 0.3);
            transform-origin: left center;
            transform: scaleX(0);
        }
    </style>
</head>

<body>

    <!-- Progress bar -->
    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>


    <iframe
        id="dashboard0"
        class="dashboard active"
        src="http://192.168.0.15:8123/dashboard-playground/0?kiosk"
        scrolling="no"
        allowfullscreen>
    </iframe>

    <iframe
        id="dashboard1"
        class="dashboard"
        src="http://192.168.0.15:8123/dashboard-playground/device-usage?kiosk"
        scrolling="no"
        allowfullscreen>
    </iframe>


    <script>

        // ==========================================
        // SETTINGS
        // ==========================================

        // Time each dashboard stays visible
        const interval = 30 * 1000;


        // ==========================================
        // ELEMENTS
        // ==========================================

        const dashboards = [
            document.getElementById("dashboard0"),
            document.getElementById("dashboard1")
        ];

        const progressBar = document.getElementById("progressBar");

        let currentIndex = 0;


        // ==========================================
        // PROGRESS BAR
        // ==========================================

        function resetProgressBar() {

            // Start at 0%
            progressBar.style.transition = "none";
            progressBar.style.transform = "scaleX(0)";

            // Force browser reflow
            progressBar.offsetHeight;

            // Animate from 0% to 100%
            progressBar.style.transition =
                `transform ${interval}ms linear`;

            progressBar.style.transform = "scaleX(1)";
        }


        // ==========================================
        // ROTATION
        // ==========================================

        function showNextPage() {

            // Fade current dashboard out
            dashboards[currentIndex].classList.remove("active");

            // Move to next dashboard
            currentIndex = (currentIndex + 1) % dashboards.length;

            // Fade next dashboard in
            dashboards[currentIndex].classList.add("active");

            // Restart progress bar
            resetProgressBar();
        }


        // ==========================================
        // START
        // ==========================================

        resetProgressBar();

        setInterval(showNextPage, interval);

    </script>

</body>
</html>
